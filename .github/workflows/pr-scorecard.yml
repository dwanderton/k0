# Hallucination gate + scorecard comment for PRs. Fires when Vercel reports
# a successful Preview deployment, runs the scorecard against that exact
# preview (RUNS=5, ~$0.04), fails the check if groundedness drops below 80%
# or any control false-positive appears, and upserts one PR comment with the
# full output either way.
#
# Required repo secrets:
#   SCORECARD_PROBE_SECRET          — bypasses BotID + WAF rate limit
#   VERCEL_AUTOMATION_BYPASS_SECRET — opens SSO-protected previews

name: pr-scorecard

on: [deployment_status]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # deployment_status runs with repo secrets — never check out or execute
      # the deployed commit: for a fork PR that is attacker-controlled code
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          lfs: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26

      # fork-PR previews run the fork author's server code — probing them
      # would hand both probe secrets to that code. Same-repo heads only.
      - name: Find PR for this deployment (same-repo only)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: |
          PR=$(gh api "repos/${{ github.repository }}/commits/$DEPLOY_SHA/pulls" --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$PR" ]; then echo "No PR for this deployment — skipping."; fi
          if [ -n "$PR" ]; then
            HEAD_REPO=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.head.repo.full_name')
            if [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
              echo "Fork PR ($HEAD_REPO) — gate skipped, secrets stay home."
              PR=""
            fi
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Scorecard against preview (gated)
        if: steps.pr.outputs.number != ''
        id: scorecard
        env:
          SCORECARD_PROBE_SECRET: ${{ secrets.SCORECARD_PROBE_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          GATE: "1"
          RUNS: "5"
        run: |
          # pipefail: $? must be node's exit code, not tee's — without it the
          # gate result never reaches the Enforce step
          set +e -o pipefail
          # probe headers carry secrets — host-anchored check, not a URL glob
          # (case globs match "/" so https://evil.com/x.vercel.app would pass)
          host="${TARGET_URL#https://}"; host="${host%%/*}"
          case "$host" in
            *.vercel.app) ;;
            *) echo "Unexpected deployment host: $host"; echo "exit=1" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          node scorecard/run.mjs "$TARGET_URL" | tee /tmp/scorecard.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Upsert PR comment with scorecard output
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: |
          {
            echo "<!-- k0-scorecard -->"
            echo "### k0 scorecard — hallucination gate"
            echo
            echo "Preview: $TARGET_URL · commit \`$DEPLOY_SHA\`"
            echo
            cat /tmp/scorecard.md
          } > /tmp/comment.md
          PR=${{ steps.pr.outputs.number }}
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/$PR/comments?per_page=100" --jq '.[] | select(.body | startswith("<!-- k0-scorecard -->")) | .id' | head -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING" -F body=@/tmp/comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file /tmp/comment.md
          fi

      - name: Enforce gate
        if: steps.pr.outputs.number != ''
        run: exit ${{ steps.scorecard.outputs.exit }}
